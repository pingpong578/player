<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; }
  .video { position: relative; width: 100%; height: 0; padding-bottom: 56.25%; background: #000; }
  .video iframe, .video #player { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="video"><div id="player"></div></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  var vid = new URLSearchParams(location.search).get('v');
  function onYouTubeIframeAPIReady() {
    if (!vid) return;
    new YT.Player('player', {
      videoId: vid,
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1 }
    });
  }
</script>
</body>
</html>
