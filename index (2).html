<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadowing Player</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #111; color: #eee; font-family: -apple-system, system-ui, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 8px; }
  .video { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .video iframe, .video #player { position: absolute; inset: 0; width: 100%; height: 100%; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  button { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 8px; padding: 10px 14px; font-size: 15px; }
  button.active { background: #2f6fed; border-color: #2f6fed; }
  .label { font-size: 14px; color: #aaa; }
  #msg { margin-top: 10px; color: #f88; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="video"><div id="player"></div></div>
  <div class="controls">
    <button id="replay">&#8635; Phát lại đoạn</button>
    <button id="loop" class="active">Lặp: Bật</button>
  </div>
  <div class="controls">
    <span class="label">Tốc độ</span>
    <button data-rate="0.25">0.25x</button>
    <button data-rate="0.5">0.5x</button>
    <button data-rate="0.75">0.75x</button>
    <button data-rate="1">1x</button>
    <button data-rate="1.25">1.25x</button>
    <button data-rate="1.5">1.5x</button>
    <button data-rate="1.75">1.75x</button>
    <button data-rate="2">2x</button>
  </div>
  <div id="msg"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  // Tham số trên URL: ?v=VIDEO_ID&start=12&end=18&loop=1&rate=0.75
  var q = new URLSearchParams(location.search);
  var vid = q.get('v');
  var start = parseFloat(q.get('start')) || 0;
  var end = q.get('end') ? parseFloat(q.get('end')) : null;
  var loop = q.get('loop') !== '0';
  var rate = parseFloat(q.get('rate')) || 1;
  var player = null;

  var loopBtn = document.getElementById('loop');
  var rateBtns = document.querySelectorAll('[data-rate]');

  function showLoop() {
    loopBtn.textContent = 'Lặp: ' + (loop ? 'Bật' : 'Tắt');
    loopBtn.classList.toggle('active', loop);
  }
  function showRate() {
    rateBtns.forEach(function (b) {
      b.classList.toggle('active', parseFloat(b.dataset.rate) === rate);
    });
  }
  function replay() {
    if (!player) return;
    player.seekTo(start, true);
    player.playVideo();
  }

  function onYouTubeIframeAPIReady() {
    if (!vid) {
      document.getElementById('msg').textContent = 'Thiếu tham số v (ID video). Ví dụ: ?v=dQw4w9WgXcQ&start=10&end=20';
      return;
    }
    player = new YT.Player('player', {
      videoId: vid,
      playerVars: { start: Math.floor(start), playsinline: 1, rel: 0, modestbranding: 1 },
      events: {
        onReady: function () {
          player.setPlaybackRate(rate);
          setInterval(tick, 150);
        },
        onStateChange: function (e) {
          // Hết video: nếu đang lặp thì quay lại đầu đoạn
          if (e.data === YT.PlayerState.ENDED && loop) replay();
          // Đặt lại tốc độ khi video bắt đầu phát (một số trình duyệt reset)
          if (e.data === YT.PlayerState.PLAYING) player.setPlaybackRate(rate);
        },
        onError: function (e) {
          document.getElementById('msg').textContent = 'Lỗi YouTube: ' + e.data;
        }
      }
    });
  }

  function tick() {
    if (!player || end === null) return;
    if (player.getPlayerState() !== YT.PlayerState.PLAYING) return;
    if (player.getCurrentTime() >= end) {
      if (loop) { player.seekTo(start, true); }
      else { player.pauseVideo(); }
    }
  }

  document.getElementById('replay').onclick = replay;
  loopBtn.onclick = function () { loop = !loop; showLoop(); };
  rateBtns.forEach(function (b) {
    b.onclick = function () {
      rate = parseFloat(b.dataset.rate);
      if (player) player.setPlaybackRate(rate);
      showRate();
    };
  });
  showLoop();
  showRate();
</script>
</body>
</html>
